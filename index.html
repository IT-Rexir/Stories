<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(to top, mediumpurple, white);
  font-family: Arial;
}

.authBox {
  background: linear-gradient(to left, grey, black);
  padding: 20px;
  border-radius: 12px;
  width: 300px;
  color: white;
  text-align: center;
}

/* ✅ LOGO FIX */
#logo {
  text-align: center;
  margin-bottom: 10px;
}

#logo img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
}

.authBox input {
  width: 95%;
  margin: 5px 0;
  padding: 8px;
  border-radius: 8px;
  border: none;
}

.authBox button {
  width: 100%;
  padding: 8px;
  margin-top: 8px;
  border: none;
  border-radius: 8px;
  background: #3b82f6;
  color: white;
}

.authBox p {
  color: #93c5fd;
  cursor: pointer;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="authBox">

  <!-- ✅ LOGO NOW INSIDE -->
  <div id="logo">
    <img src="IMG_20260501_191749.png" alt="logo">
  </div>

  <!-- LOGIN -->
  <div id="loginBox">
    <h2>Login</h2>
    <input id="log-email" type="email" placeholder="Email">
    <input id="log-password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p onclick="showRegister()">Create account</p>
  </div>

  <!-- REGISTER -->
  <div id="registerBox" class="hidden">
    <h2>Register</h2>
    <input id="reg-email" type="email" placeholder="Email">
    <input id="reg-password" type="password" placeholder="Password">
    <button onclick="register()">Register</button>
    <p onclick="showLogin()">Back to login</p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBs5yfx6M_YqGICH0alcoAvm3OkTLpeSKo",
  authDomain: "tdmessager-27703.firebaseapp.com",
  projectId: "tdmessager-27703",
  appId: "1:411419610823:web:e03920275ed8370753b8e2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* AUTO LOGIN */
onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.href = "main.html";
  }
});

/* UI SWITCH */
window.showRegister = () => {
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("registerBox").classList.remove("hidden");
};

window.showLogin = () => {
  document.getElementById("registerBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
};

/* LOGIN */
window.login = () => {
  const email = document.getElementById("log-email").value;
  const password = document.getElementById("log-password").value;

  if (!email || !password) {
    alert("Please fill all fields");
    return;
  }

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      window.location.href = "main.html";
    })
    .catch(err => {
      console.log(err.code);
      alert(err.message);
    });
};

/* REGISTER */
window.register = () => {
  const email = document.getElementById("reg-email").value;
  const password = document.getElementById("reg-password").value;

  if (!email || !password) {
    alert("Please fill all fields");
    return;
  }

  createUserWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("Account created!");
      window.location.href = "main.html";
    })
    .catch(err => alert(err.message));
};
</script>

</body>
</html>
